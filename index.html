<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>孤筏重洋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
body{background:#f5f0e8;color:#2c2c2c;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;touch-action:manipulation}
b{font-weight:600}
.top-bar{background:#fff;padding:8px 14px 6px;flex-shrink:0;border-bottom:1px solid #e8e0d4;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.day-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px;color:#8a7e6e}
.day-info span{display:flex;align-items:center;gap:3px}
.stat{margin-bottom:3px;display:flex;align-items:center;gap:4px}
.stat-label{font-size:9px;width:42px;text-align:left;flex-shrink:0;color:#5a5040;font-weight:500}
.stat-bar-bg{flex:1;height:8px;background:#f0ebe2;border-radius:4px;overflow:hidden}
.stat-bar{height:100%;border-radius:4px;transition:width .4s}
.stat-bar.hunger{background:linear-gradient(90deg,#e8a040,#d4882a)}
.stat-bar.stamina{background:linear-gradient(90deg,#5aa87a,#3d8b5e)}
.stat-bar.health{background:linear-gradient(90deg,#d45a5a,#c03030)}
.stat-bar.wellness{background:linear-gradient(90deg,#6ab0e8,#3a80c0)}
.stat-bar.durability{background:linear-gradient(90deg,#b08a50,#8a6a30)}
.stat-val{font-size:10px;width:24px;text-align:right;flex-shrink:0;color:#8a7e6e}
.warn-banner{display:none;background:#fff3e0;border:1px solid #ffcc80;border-radius:5px;padding:3px 8px;margin-bottom:4px;font-size:10px;color:#e65100;text-align:center}
.warn-banner.show{display:block}
.buff-bar{display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap}
.buff-tag{font-size:9px;background:#f0fff0;border:1px solid #b0d8b0;border-radius:4px;padding:1px 5px;color:#3d8b5e}
.buff-tag.debuff{background:#fff5f0;border-color:#e8b0a0;color:#c03030}
.log-area{flex:1;overflow-y:auto;padding:8px 14px;-webkit-overflow-scrolling:touch;background:#faf6ef}
.log-area::-webkit-scrollbar{width:2px}.log-area::-webkit-scrollbar-thumb{background:#d4c8b4;border-radius:2px}
.log-entry{margin-bottom:5px;padding:7px 9px;background:#fff;border-radius:7px;font-size:12px;line-height:1.6;color:#3a3428;border-left:3px solid #d4c8b4;animation:fi .3s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.log-entry.event{border-left-color:#e8a040;background:#fffaf0}
.log-entry.danger{border-left-color:#c03030;background:#fff5f5}
.log-entry.reward{border-left-color:#3d8b5e;background:#f5fff8}
.log-entry .tt{font-size:9px;color:#b0a490;margin-bottom:1px}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.panel-area{flex-shrink:0;max-height:40vh;overflow-y:auto;background:#fff;border-top:1px solid #e8e0d4;-webkit-overflow-scrolling:touch}
.panel{display:none;padding:8px 14px}.panel.active{display:block}
.action-btn{display:block;width:100%;padding:10px 12px;margin-bottom:5px;background:#faf6ef;border:1px solid #e0d8c8;border-radius:8px;color:#3a3428;font-size:13px;cursor:pointer;text-align:left;transition:all .15s;touch-action:manipulation}
.action-btn:active{background:#f0e8d8;transform:scale(.98)}
.action-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.action-btn .sub{font-size:10px;color:#a09880;margin-top:2px}
.tab-bar{display:flex;background:#fff;border-top:1px solid #e8e0d4;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;padding:7px 0 5px;text-align:center;font-size:9px;color:#b0a490;background:none;border:none;cursor:pointer;position:relative;touch-action:manipulation}
.tab-btn.active{color:#5a7a4a}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:25%;width:50%;height:2px;background:#5a7a4a;border-radius:1px}
.tab-btn .ti{font-size:17px;display:block;margin-bottom:1px}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.inv-slot{background:#faf6ef;border:1px solid #e0d8c8;border-radius:7px;padding:6px 2px;text-align:center;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.inv-slot:active{background:#f0e8d8}
.inv-slot .ii{font-size:18px;margin-bottom:1px}.inv-slot .in{font-size:8px;color:#8a7e6e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.inv-slot .ic{font-size:10px;color:#5a7a4a;font-weight:600}
.inv-slot.empty{opacity:.15;cursor:default;border-style:dashed}
.inv-slot.food{border-color:#e8a040}.inv-slot.raw-warn{border-color:#c03030}
.ci{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:5px;background:#faf6ef;border-radius:7px;border:1px solid #e0d8c8}
.ci-icon{font-size:24px;flex-shrink:0}.ci-info{flex:1;min-width:0}
.ci-name{font-size:12px;font-weight:600}.ci-desc{font-size:9px;color:#8a7e6e}.ci-cost{font-size:9px;color:#d4882a;margin-top:2px}
.cb{padding:5px 10px;background:#5a7a4a;border:none;border-radius:5px;color:#fff;font-size:11px;cursor:pointer;flex-shrink:0;touch-action:manipulation}
.cb:disabled{opacity:.2;cursor:not-allowed}.cb.built{background:#a0a0a0}
.st{font-size:11px;font-weight:600;color:#8a7e6e;margin:8px 0 5px;padding-bottom:3px;border-bottom:1px solid #e8e0d4}
.si,.ti{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:5px;background:#faf6ef;border-radius:7px;border:1px solid #e0d8c8}
.si-icon,.ti-icon{font-size:20px;flex-shrink:0}.si-info,.ti-info{flex:1;min-width:0}
.si-name,.ti-name{font-size:12px;font-weight:600}.si-desc,.ti-desc{font-size:9px;color:#8a7e6e;margin-top:1px}
.si-price{font-size:11px;color:#d4882a;font-weight:600;flex-shrink:0}
.td{padding:5px 10px;background:#5a7a4a;border:none;border-radius:5px;color:#fff;font-size:11px;cursor:pointer;flex-shrink:0;touch-action:manipulation}
.td:disabled{opacity:.2}.cur-bar{display:flex;gap:12px;margin-bottom:6px;font-size:12px;color:#d4882a;font-weight:600}
.ov{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.ov.hidden{display:none}.ov-bg{position:absolute;inset:0;background:rgba(42,36,28,.88)}
.ov-c{position:relative;z-index:1;width:100%;max-width:340px;text-align:center}
.ov h2{font-size:17px;color:#f5f0e8;margin-bottom:5px}.ov p{font-size:12px;color:#c8bca8;margin-bottom:12px;line-height:1.6}
.tl{width:100%}
.tb{display:flex;align-items:center;gap:8px;width:100%;padding:10px;margin-bottom:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#f0e8d8;font-size:12px;cursor:pointer;text-align:left;touch-action:manipulation}
.tb:active{background:rgba(255,255,255,.15);border-color:#5a7a4a}
.tb .tbi{font-size:20px;flex-shrink:0}.tb .tbd{font-size:9px;color:#c8bca8;margin-top:1px}
.death-ov{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.death-ov.hidden{display:none}.death-ov .ov-bg{background:rgba(30,10,10,.92)}
.death-ov h2{font-size:18px;color:#d45a5a;margin-bottom:8px}
.death-stats{text-align:center;margin-bottom:14px;font-size:13px;color:#e0d0c0;line-height:2}
.death-btn{padding:10px 28px;background:#5a7a4a;border:none;border-radius:8px;color:#fff;font-size:13px;cursor:pointer;margin-bottom:5px;touch-action:manipulation}
.tal-sec{margin-top:10px;text-align:left;width:100%;max-width:300px}
.tal-sec h3{font-size:12px;color:#e8a040;margin-bottom:6px}
.tal-btn{display:block;width:100%;padding:8px;margin-bottom:5px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#e0d0c0;font-size:11px;cursor:pointer;text-align:left;touch-action:manipulation}
.tal-btn:disabled{opacity:.25}.tal-btn.sel{border-color:#e8a040;background:rgba(232,160,64,.12)}
.ev-ov{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.ev-ov.hidden{display:none}.ev-ov .ov-bg{background:rgba(20,35,30,.9)}
.ev-ov h2{font-size:16px;color:#7cc8a0;margin-bottom:6px}
.ev-ov p{font-size:12px;color:#d0e8dc;margin-bottom:12px;line-height:1.7}
.ev-btn{padding:9px 24px;border:none;border-radius:7px;color:#fff;font-size:13px;cursor:pointer;margin-bottom:6px;touch-action:manipulation}
.ev-btn.p{background:#5a7a4a}.ev-btn.s{background:#6a6a6a}
.ev-ch{display:flex;flex-direction:column;gap:6px;margin-top:8px;width:100%;max-width:300px}
.evc{padding:9px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:7px;color:#f0e8d8;font-size:12px;cursor:pointer;text-align:left;touch-action:manipulation}
.evc:active{background:rgba(255,255,255,.2)}
.modal{position:fixed;inset:0;z-index:180;display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.modal-box{position:relative;z-index:1;background:#fff;border:1px solid #e0d8c8;border-radius:10px;padding:14px;max-width:280px;width:100%;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.modal-box h3{font-size:14px;margin-bottom:6px;color:#3a3428}
.modal-box p{font-size:12px;color:#6a6050;line-height:1.6;margin-bottom:10px}
.modal-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.modal-act button{flex:1;min-width:60px;padding:7px;border:none;border-radius:5px;font-size:12px;cursor:pointer;touch-action:manipulation}
.mc{background:#5a7a4a;color:#fff}
.mx{background:#f0ebe2;color:#8a7e6e}
.md{background:#d45a5a;color:#fff}
.brief-ov{position:fixed;inset:0;z-index:160;display:flex;align-items:center;justify-content:center;padding:16px}
.brief-ov.hidden{display:none}.brief-ov .ov-bg{background:rgba(42,36,28,.65)}
.brief-box{position:relative;z-index:1;background:#fff;border-radius:12px;padding:16px;max-width:280px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.12);text-align:center}
.brief-box h3{font-size:15px;color:#5a7a4a;margin-bottom:6px}
.brief-box p{font-size:11px;color:#6a6050;line-height:1.7;margin-bottom:10px;white-space:pre-line}
.brief-btn{padding:7px 20px;background:#5a7a4a;border:none;border-radius:7px;color:#fff;font-size:12px;cursor:pointer;touch-action:manipulation}
.confirm-modal .modal-box{max-width:240px}
.confirm-modal .modal-act button{flex:1}
</style>
</head>
<body>
<!-- overlays -->
<div class="ov" id="traitOv"><div class="ov-bg"></div><div class="ov-c"><h2>🌊 孤筏重洋</h2><p>茫茫大海，一叶孤筏。选择你的天赋，开始求生。</p><div class="tl" id="traitList"></div></div></div>
<div class="death-ov hidden" id="deathOv"><div class="ov-bg"></div><div class="ov-c"><h2>📖 航海日志 · 终章</h2><div class="death-stats" id="deathStats"></div><div class="tal-sec" id="talSec"></div><button class="death-btn" id="restartBtn">重新出发</button></div></div>
<div class="ev-ov hidden" id="islandOv"><div class="ov-bg"></div><div class="ov-c"><h2 id="islTitle"></h2><p id="islDesc"></p><button class="ev-btn p" id="exploreBtn">登岛探索</button><button class="ev-btn s" id="skipBtn">继续航行</button></div></div>
<div class="ev-ov hidden" id="eventOv"><div class="ov-bg"></div><div class="ov-c"><h2 id="evTitle"></h2><p id="evDesc"></p><div class="ev-ch" id="evChoices"></div></div></div>
<div class="brief-ov hidden" id="briefOv"><div class="ov-bg"></div><div class="brief-box"><h3 id="briefTitle">🌅 清晨简报</h3><p id="briefContent"></p><button class="brief-btn" id="briefBtn">继续</button></div></div>
<div class="modal hidden" id="itemModal"><div class="modal-bg" id="modalBg"></div><div class="modal-box"><h3 id="mTitle"></h3><p id="mDesc"></p><div class="modal-act" id="mActions"></div></div></div>
<!-- Confirm Modal (reuse) -->
<div class="modal hidden confirm-modal" id="confirmModal"><div class="modal-bg" id="confirmBg"></div><div class="modal-box"><h3 id="confirmTitle">确认操作</h3><p id="confirmDesc"></p><div class="modal-act" id="confirmActions"></div></div></div>
<!-- top -->
<div class="top-bar">
<div class="warn-banner" id="warn"></div>
<div class="buff-bar" id="buffBar"></div>
<div class="day-info"><span>📅 第<b id="dDay">1</b>天</span><span>🕐 <b id="dHour">6</b>:00</span><span>⛵ <b id="dDist">0</b>海里</span><span id="zoneLabel" style="color:#5a7a4a;font-weight:600">🌊近海</span></div>
<div class="stat"><span class="stat-label">🍖饥饿</span><div class="stat-bar-bg"><div class="stat-bar hunger" id="bHunger" style="width:100%"></div></div><span class="stat-val" id="vHunger">100</span></div>
<div class="stat"><span class="stat-label">⚡体力</span><div class="stat-bar-bg"><div class="stat-bar stamina" id="bStam" style="width:100%"></div></div><span class="stat-val" id="vStam">100</span></div>
<div class="stat"><span class="stat-label">❤️生命</span><div class="stat-bar-bg"><div class="stat-bar health" id="bHp" style="width:100%"></div></div><span class="stat-val" id="vHp">100</span></div>
<div class="stat"><span class="stat-label">🧠精神</span><div class="stat-bar-bg"><div class="stat-bar wellness" id="bWell" style="width:100%"></div></div><span class="stat-val" id="vWell">100</span></div>
<div class="stat"><span class="stat-label">🛶船体</span><div class="stat-bar-bg"><div class="stat-bar durability" id="bDur" style="width:100%"></div></div><span class="stat-val" id="vDur">100</span></div>
</div>
<!-- log -->
<div class="log-area" id="log"></div>
<!-- panels -->
<div class="panel-area">
<div class="panel active" id="pFish">
<div style="margin-bottom:5px;font-size:11px;color:#8a7e6e">鱼竿：<b id="rodLv">Lv.1 竹木竿</b> <span id="baitInfo" style="color:#d4882a"></span> | 淡水：<b id="freshWater">0</b></div>
<button class="action-btn" id="fishBtn">🎣 钓鱼<div class="sub">体力-8 · 2小时</div></button>
<button class="action-btn" id="restBtn">😴 休息<div class="sub">恢复体力 · 自选时长</div></button>
<button class="action-btn" id="sleepBtn">🌙 过夜<div class="sub">睡到次日清晨 · 体力回满</div></button>
<button class="action-btn" id="meditateBtn">🧘 冥想<div class="sub">恢复精神+8 · 耗时1小时 · 冷却8小时</div></button>
</div>
<div class="panel" id="pBag"><div style="margin-bottom:5px;font-size:11px;color:#8a7e6e">背包 <b id="bagUsed">0</b>/<b id="bagMax">16</b></div><div class="inv-grid" id="invGrid"></div></div>
<div class="panel" id="pCraft">
<div class="st">设施建造</div><div id="craftList"></div>
<div class="st">鱼竿升级</div><div id="rodUp"></div>
<div class="st">船体升级</div><div id="shipUp"></div>
<div class="st">🧪 合成</div><div id="craftRecipes"></div>
</div>
<div class="panel" id="pShop"><div class="cur-bar"><span>🐚 <b id="cShell">0</b></span><span>💎 <b id="cPearl">0</b></span></div><div id="shopList"></div></div>
<div class="panel" id="pTrade"><div style="margin-bottom:5px;font-size:11px;color:#8a7e6e">今日交易：<b id="tLeft">2</b>/2</div><div id="tradeList"></div></div>
<div class="panel" id="pCrew"><div class="st">👥 船员管理（<b id="crewCount">0</b>/3）</div><div id="crewList"></div></div>
</div>
<div class="tab-bar">
<button class="tab-btn active" data-tab="Fish"><span class="ti">🎣</span>钓鱼</button>
<button class="tab-btn" data-tab="Bag"><span class="ti">🎒</span>背包</button>
<button class="tab-btn" data-tab="Craft"><span class="ti">🔨</span>建造</button>
<button class="tab-btn" data-tab="Shop"><span class="ti">🏪</span>商店</button>
<button class="tab-btn" data-tab="Trade"><span class="ti">🤝</span>交易</button>
<button class="tab-btn" data-tab="Crew"><span class="ti">👥</span>船员</button>
</div>

/* ========== HELPERS ========== */
function addI(g,n,i,t,s,c){
  if(!g.inv[n]){g.inv[n]=0;}
  g.inv[n]+=c;
  g.invI[n]=i;
  g.invT[n]={t:t,s:s};
}
function remI(g,n,c){
  if(!g.inv[n]||g.inv[n]<c){return false;}
  g.inv[n]-=c;
  if(g.inv[n]<=0){delete g.inv[n];delete g.invI[n];delete g.invT[n];}
  return true;
}
function cntSub(g,s){
  var t=0;
  for(var k in g.inv){
    var i=g.invT[k];
    if(i&&i.s===s){t+=g.inv[k];}
  }
  return t;
}
function hasC(g,c){
  for(var k in c){
    var f=0;
    for(var inv in g.inv){
      var i=g.invT[inv];
      if(i&&(i.s===k||inv===k)){f+=g.inv[inv];}
    }
    if(f<c[k]){return false;}
  }
  return true;
}
function useC(g,c){
  for(var k in c){
    var r=c[k];
    for(var inv in g.inv){
      var i=g.invT[inv];
      if(i&&(i.s===k||inv===k)){
        var t=Math.min(g.inv[inv],r);
        g.inv[inv]-=t;
        r-=t;
        if(g.inv[inv]<=0){delete g.inv[inv];delete g.invI[inv];delete g.invT[inv];}
        if(r<=0){break;}
      }
    }
  }
}
function totalBag(g){
  var t=0;
  for(var k in g.inv){t+=g.inv[k];}
  return t;
}
function countFood(g){
  var t=0;
  for(var k in g.inv){
    var i=g.invT[k];
    if(i&&i.t==='food'){t+=g.inv[k];}
  }
  return t;
}
function removeFood(g,n){
  var rem=n;
  var keys=Object.keys(g.inv);
  for(var idx=0;idx<keys.length;idx++){
    var k=keys[idx];
    var i=g.invT[k];
    if(i&&i.t==='food'){
      var t=Math.min(g.inv[k],rem);
      g.inv[k]-=t;
      rem-=t;
      if(g.inv[k]<=0){delete g.inv[k];delete g.invI[k];delete g.invT[k];}
      if(rem<=0){return true;}
    }
  }
  return rem<=0;
}
function dropRandom(g,n){
  var items=[];
  var keys=Object.keys(g.inv).filter(function(k){return g.inv[k]>0;});
  for(var i=0;i<Math.min(n,keys.length);i++){
    var k=keys[Math.floor(Math.random()*keys.length)];
    var c=Math.min(g.inv[k],1+Math.floor(Math.random()*2));
    g.inv[k]-=c;
    if(g.inv[k]<=0){delete g.inv[k];delete g.invI[k];delete g.invT[k];}
    items.push((g.invI[k]||'')+k+'×'+c);
  }
  return items.join('、');
}
function rng(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function wRand(pool){
  var adj=pool.map(function(it){return {n:it.n,i:it.i,t:it.t,s:it.s,r:it.r,w:it.w,h:it.h,minD:it.minD,maxD:it.maxD};});
  var tw=adj.reduce(function(s,i){return s+i.w;},0);
  var r=Math.random()*tw,c=0;
  for(var idx=0;idx<adj.length;idx++){
    c+=adj[idx].w;
    if(r<=c){return adj[idx];}
  }
  return adj[0];
}

// 获取当前流域可钓鱼种
function getFishPool(g){
  var dist=g.dist;
  var all=[];
  for(var lv=1;lv<=4;lv++){
    for(var idx=0;idx<FISH[lv].length;idx++){
      var f=FISH[lv][idx];
      if(dist>=f.minD && dist<=f.maxD){
        all.push(f);
      }
    }
  }
  return all;
}

// 检查当前流域是否匹配事件zone
function eventInZone(e){
  var zone=getZone(G.dist);
  if(!e.zone) return true; // 默认全区域
  return e.zone.indexOf(zone.id)>=0;
}

/* ========== ADVANCE TIME ========== */
function adv(h){
  if(!G||G.over){return;}
  for(var i=0;i<h;i++){
    G.hour++;
    var sp=0.5*(G._spMod||1);
    if(G._spB>0){sp*=2;G._spB--;}
    G.dist+=sp;
    var hd=1.5*(G._hMod||1);
    if(G.trait==='camel'){hd*=0.7;}
    G.hunger=Math.max(0,G.hunger-hd);
    if(G.hunger<=0){var d=3;if(G.trait==='tough'){d=1.5;}G.hp=Math.max(0,G.hp-d);}
    // 精神（well）在深海/极地缓慢下降
    var zone=getZone(G.dist);
    if(zone.id==='deep' || zone.id==='polar'){
      G.well=Math.max(0,G.well-0.2);
    }
    // 自然恢复（仅当饥饿>60且精神>50）
    if(G.hunger>60 && G.well>50 && G.hp<G.maxHp) G.hp=Math.min(G.maxHp,G.hp+0.3);
    if(G.well<100 && G.hunger>50) G.well=Math.min(100,G.well+0.3);
    // 感冒减体力
    if(G._cold && G.bld.shelter<1){G.stamina=Math.max(0,G.stamina-0.5);}
    // 信天翁赠鱼
    if(G._albatross && G.hour===12){addI(G,'沙丁鱼','🐟','food',null,1);}
    // 船员执行每日任务（只在每天6点执行一次）
    if(G.hour===6 && G._crew>0){
      for(var ci=0;ci<G._crew;ci++){
        var job=G.crewJobs[ci]||'none';
        if(job==='repair'){
          G.durability=Math.min(G.maxDur,G.durability+2);
          addLog('🛠️ 船员修船，耐久+2','reward');
        }else if(job==='fish'){
          var pool=getFishPool(G);
          if(pool.length>0){
            var f=pool[Math.floor(Math.random()*pool.length)];
            if(f && totalBag(G)<G.bagMax){
              addI(G,f.n,f.i,f.t,f.s||null,1);
              addLog('🎣 船员钓到'+f.i+f.n,'reward');
            }
          }
        }else if(job==='lookout'){
          G._spMod=(G._spMod||1)*1.05; // 叠加航速
        }
      }
    }
    // 冷却
    if(G.meditateCooldown>0) G.meditateCooldown--;
    if(G._glowB>0) G._glowB--;
    if(G._noJunk>0) G._noJunk--;
    // 连续未登岛检测（每天6点检查）
    if(G.hour===6 && G.day>G._lastDayChecked){
      G._lastDayChecked=G.day;
      if(G.vis.length===0 || (G.day - G._lastIslandDay)>3){
        G.well=Math.max(0,G.well-5);
        addLog('🌊 连续多日漂泊，精神-5','danger');
      }
    }
    // 切换日期
    if(G.hour>24){
      G.hour=1;G.day++;G.totDays=G.day;G.tLeft=2;G.briefDone=false;
      if(G._aurora){G._aurora=false;}
      refreshTrades();
    }
    // 晨报
    if(G.hour===6 && !G.briefDone){G.briefDone=true;showBrief();}
    // 耐久归零
    if(G.durability<=0){addLog('💀 木筏散架了！你沉入了大海...','danger');G.hp=0;handleDeath();return;}
    // 风暴
    if(G.hour===9 && Math.random()<0.12 && !G._stormComing){G._stormComing=true;}
    if(G.hour===12 && G._stormComing){G._stormComing=false;triggerStorm();}
    // 随机事件（每6小时，且事件区域匹配）
    if(G.hour%6===0 && G.hour!==G._lastEv && Math.random()<0.25){
      G._lastEv=G.hour;trySeaEvent();
    }
    // 精神归零后果：钓鱼成功率减半，每小时可能丢物资
    if(G.well<=0){
      if(Math.random()<0.1){
        var lost=dropRandom(G,1);
        addLog('🧠 精神恍惚，丢失了'+lost,'danger');
      }
    }
    if(G.hp<=0){handleDeath();return;}
  }
  if(G.hp<=0){handleDeath();return;}
  upd();save();
}

function trySeaEvent(){
  var all=SEA_EV.concat(NIGHT_EV).concat(SPECIAL_EV);
  // 过滤区域
  var valid=all.filter(function(e){return (!e.cond||e.cond(G)) && eventInZone(e);});
  // 随机打乱
  for(var i=valid.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=valid[i];valid[i]=valid[j];valid[j]=tmp;}
  for(var idx=0;idx<valid.length;idx++){
    var e=valid[idx];
    if(Math.random()<e.ch){
      showEvChoice(e.i+' '+e.n,e.desc,e.opts);
      return;
    }
  }
}

function triggerStorm(){
  var lv=G.bld.shelter||0;
  var red=[0,0.3,0.6,0.6,0.9][lv]||0;
  if(G._stormPrep==='half'){red=Math.max(red,0.5);}
  if(G._stormPrep==='slow'){red=Math.max(red,0.3);}
  if(G._stormPrep==='none'){red=0;}
  if(G._buff==='shield'){red=Math.max(red,0.5);G._buff=null;}
  var durDmg=Math.floor((15+Math.random()*20)*(1-red));
  var hpDmg=Math.floor((8+Math.random()*12)*(1-red));
  G.durability=Math.max(0,G.durability-durDmg);
  G.hp=Math.max(0,G.hp-hpDmg);
  var lost='';
  if(red<0.3){lost=dropRandom(G,Math.ceil(Math.random()*3));}
  addLog('⛈️ 暴风雨来袭！船耐久-'+durDmg+'，生命-'+hpDmg+(lost?'，丢失物资：'+lost:'')+(lv>=1?'。庇护所减伤'+Math.round(red*100)+'%':''),red>0.3?'event':'danger');
  G._stormPrep=null;
  if(G.hp<=0||G.durability<=0){handleDeath();}
}

/* ========== ACTIONS ========== */
function doFish(){
  if(G.over){return;}
  var cost=8;if(G.trait==='energy'){cost=Math.ceil(8*0.9);}if(G._cold){cost=Math.ceil(cost*1.2);}
  if(G.stamina<cost){addLog('⚠️ 体力不足！','danger');return;}
  // 精神过低影响成功率
  if(G.well<=0 && Math.random()<0.5){
    addLog('🧠 精神恍惚，鱼跑了...','danger');
    G.stamina-=cost;
    adv(2);
    return;
  }
  G.stamina-=cost;
  // 先检查钓鱼特殊事件
  var fEv=FISH_EV.filter(function(e){return (!e.cond||e.cond(G)) && eventInZone(e) && Math.random()<e.ch;});
  if(fEv.length>0){
    var e=fEv[Math.floor(Math.random()*fEv.length)];
    showEvChoice(e.i+' '+e.n,e.desc,e.opts);
    adv(2);
    return;
  }
  // 普通钓鱼
  var pool=getFishPool(G);
  if(pool.length===0){
    addLog('这片海域没有鱼...','danger');
    adv(2);
    return;
  }
  var qb=0;if(G.bait>0){qb=1;G.bait--;}if(G._fishB>0){qb++;G._fishB--;}if(G._glowB>0){qb++;}if(G._siren){qb++;}if(G._buff==='hunt'){qb++;G._buff=null;}
  var rb=(G.trait==='fisher'?0.2:0)+(G.trait==='lucky'?0.15:0);
  var adj=pool.map(function(it){
    var w=it.w;if(it.r>=2){w*=(1+rb+qb*0.25);}
    return {n:it.n,i:it.i,t:it.t,s:it.s,r:it.r,w:w,h:it.h};
  });
  var tw=adj.reduce(function(s,i){return s+i.w;},0);
  var rand=Math.random()*tw,c=0;
  var catch_=adj[0];
  for(var idx=0;idx<adj.length;idx++){
    c+=adj[idx].w;
    if(rand<=c){catch_=adj[idx];break;}
  }
  G.totFish++;
  if(catch_.t==='chest'){
    var items=[];
    var n=2+Math.floor(Math.random()*3);
    for(var i=0;i<n;i++){
      var l=CHEST_LOOT[Math.floor(Math.random()*CHEST_LOOT.length)];
      var cc=rng(l.c[0],l.c[1]);
      if(catch_.r>=3){cc=Math.ceil(cc*1.5);}
      addI(G,l.n,l.i,l.t,l.s,cc);
      items.push(l.i+l.n+'×'+cc);
    }
    addLog('🎣 '+catch_.i+catch_.n+'！打开：'+items.join('、'),'reward');
  }else if(catch_.t==='cur'){
    if(catch_.s==='shell'){var n2=rng(1,3);G.shells+=n2;addLog('🎣 '+catch_.i+catch_.n+'，+'+n2+'贝壳！','reward');}
    else{G.pearls++;addLog('🎣 '+catch_.i+catch_.n+'，+1珍珠！','reward');}
  }else if(catch_.t==='junk'){
    addLog('🎣 '+catch_.i+catch_.n+'...没用。');
  }else if(catch_.t==='bp'){
    addI(G,catch_.n,catch_.i,catch_.t,'bp',1);
    addLog('🎣 '+catch_.i+catch_.n+'！珍贵图纸！','reward');
  }else{
    if(totalBag(G)<G.bagMax){
      addI(G,catch_.n,catch_.i,catch_.t,catch_.s||null,1);
    }else{
      addLog('🎣 '+catch_.i+catch_.n+'，但背包满了！','danger');
      adv(2);
      return;
    }
    var qn=['','普通','优良','精品','传说'][catch_.r]||'';
    addLog('🎣 '+catch_.i+catch_.n+'（'+qn+'）',catch_.r>=2?'reward':'');
  }
  adv(2);
}

function doRest(){
  if(G.over){return;}
  var base=5;var sl=G.bld.shelter||0;
  if(sl>=1){base=[5,8,12,18,18][sl]||5;}
  if(G._aurora){base*=2;}
  var hrs=Math.min(Math.ceil((G.maxS-G.stamina)/base),8);
  if(hrs<1){hrs=1;}
  G.stamina=Math.min(G.maxS,G.stamina+base*hrs);
  if(G._cold){G._cold=false;addLog('🤧 休息后感冒好了。','reward');}
  addLog('😴 休息'+hrs+'小时，恢复'+base*hrs+'体力。');
  adv(hrs);
}

function doSleep(){
  if(G.over){return;}
  var r=24-G.hour+6;if(r>18){r=24-G.hour+1;}
  G.stamina=G.maxS;
  if(G._cold){G._cold=false;addLog('🤧 睡一觉感冒好了。','reward');}
  addLog('🌙 一觉到天亮...');
  adv(r);
}

function doMeditate(){
  if(G.over){return;}
  if(G.meditateCooldown>0){
    addLog('⏳ 冥想冷却中，还需'+G.meditateCooldown+'小时。','danger');
    return;
  }
  G.well=Math.min(G.maxW,G.well+8);
  G.meditateCooldown=8;
  addLog('🧘 冥想1小时，精神+8。','reward');
  adv(1);
}

// 合成功能
function craftRecipe(rid){
  var rec=RECIPES.find(function(r){return r.id===rid;});
  if(!rec) return;
  // 检查材料
  for(var mat in rec.cost){
    var need=rec.cost[mat];
    var have=0;
    if(mat==='淡水') have=G.freshWater;
    else if(G.inv[mat]) have=G.inv[mat];
    if(have<need){addLog('材料不足：需要'+mat+'×'+need,'danger');return;}
  }
  // 消耗材料
  for(var mat in rec.cost){
    var need=rec.cost[mat];
    if(mat==='淡水') G.freshWater-=need;
    else remI(G,mat,need);
  }
  // 产出
  var res=rec.result;
  if(res.t==='mat' && res.s==='bait'){
    G.bait += res.q;
    addLog('🧪 合成了'+res.q+'个基础饵！','reward');
  }else if(res.t==='mat' && res.s==='bait_glow'){
    G._glowB += res.q*2; // 夜光饵加2次品质
    addLog('✨ 合成了'+res.q+'个夜光饵（品质+2）！','reward');
  }else if(res.n==='草药茶'){
    // 特殊物品：直接加精神
    G.well=Math.min(G.maxW,G.well+res.well);
    addLog('🍵 饮用草药茶，精神+'+res.well+'！','reward');
  }else{
    // 其他物品存入背包
    addI(G,res.n,rec.i,res.t,res.s||null,res.q);
    addLog('🧪 合成了'+res.n+'！','reward');
  }
  adv(1);
}

var mItem='';

  mItem=n;

  var c=G.inv[n]||0;
  document.getElementById('mTitle').textContent=ic+' '+n+' ×'+c;

  var actionsHtml='';
  if(info.t==='food'){
    var fi=findFood(n);
    var base=fi?fi.h:12;
    var fl=G.bld.fire||0;
    var mult=fl>=3?1.5:fl>=2?1.5:fl>=1?1.2:1;
    var act=Math.ceil(base*mult);
    var rawWarn=!fl?' ⚠️生食健康-8':'';
    var heal=fl>=1?3:0;
    desc=(fl?'🔥烹饪：':'生吃：')+'恢复'+act+'饥饿'+(heal?'+'+heal+'生命':'')+rawWarn;

  }else if(info.t==='fresh'){
    desc='淡水资源，可饮用或合成。';
    actionsHtml='<button class="mc" id="drinkFreshBtn">饮用（+5精神）</button>';
  }else if(info.s==='bait' || info.s==='bait_glow'){
    desc='鱼饵，钓鱼时自动使用。';
    actionsHtml='';
  }else if(n==='旧收音机'){
    desc='播放音乐，恢复精神+20（一次性）';
    actionsHtml='<button class="mc" id="useRadioBtn">播放</button>';
  }else if(info.t==='cur' || info.t==='mat'){
    desc='材料或货币。';
    actionsHtml='';
  }else{
    desc='普通物品。';
  }
  // 丢弃按钮
  var dropHtml='';
  if(c>0){
    dropHtml='<button class="md" id="dropOneBtn">丢弃1个</button>';
    if(c>1) dropHtml+='<button class="md" id="dropAllBtn">丢弃全部</button>';
  }
  document.getElementById('mDesc').textContent=desc;
  var actionsDiv=document.getElementById('mActions');
  actionsDiv.innerHTML=actionsHtml+dropHtml+'<button class="mx" id="closeItemModal">关闭</button>';
  // 绑定事件

  if(document.getElementById('dropAllBtn')){
    document.getElementById('dropAllBtn').addEventListener('click',function(){confirmDrop(mItem,'all');});

function findFood(n){
  for(var lv=1;lv<=4;lv++){
    for(var idx=0;idx<FISH[lv].length;idx++){
      var f=FISH[lv][idx];
      if(f.n===n&&f.t==='food'){return f;}
    }
  }
  return null;
}
function eat(n){
  if(!G.inv[n]||G.inv[n]<=0){return;}
  var fi=findFood(n);
  var base=fi?fi.h:12;
  var fl=G.bld.fire||0;
  var mult=fl>=3?1.5:fl>=2?1.5:fl>=1?1.2:1;
  var act=Math.ceil(base*mult);
  var heal=fl>=1?3:0;
  remI(G,n,1);
  G.hunger=Math.min(G.maxH,G.hunger+act);
  if(heal){G.hp=Math.min(G.maxHp,G.hp+heal);}
  if(!fl){G.well=Math.max(0,G.well-8);addLog('🍖 生吃'+n+'，+'+act+'饥饿'+(heal?'+'+heal+'生命':'')+'，精神-8⚠️','danger');}
  else{addLog('🍳 烹饪'+n+'，+'+act+'饥饿'+(heal?'+'+heal+'生命':'')+'，精神+3（热食）','reward'); G.well=Math.min(G.maxW,G.well+3);}
  adv(1);
  closeModal();
}
function drinkFresh(n){
  if(!G.inv[n]||G.inv[n]<=0){return;}
  remI(G,n,1);
  G.well=Math.min(G.maxW,G.well+5);
  addLog('💧 饮用淡水，精神+5。','reward');
  adv(1);
  closeModal();
}
function useRadio(n){
  if(!G.inv[n]||G.inv[n]<=0){return;}
  remI(G,n,1);
  G.well=Math.min(G.maxW,G.well+20);
  addLog('📻 播放旧收音机，精神+20！','reward');
  adv(1);
  closeModal();
}
function confirmDrop(n, mode){
  closeModal(); // 先关闭物品模态框
  var title='确认丢弃';
  var desc='确定要丢弃 "'+n+'" ';
  if(mode===1) desc+='1个 吗？';
  else desc+='全部 ('+G.inv[n]+'个) 吗？';
  showConfirm(title,desc,function(confirmed){
    if(confirmed){
      if(mode===1){
        if(remI(G,n,1)){
          addLog('🗑️ 丢弃了 '+n+' ×1。','event');
        }
      }else{
        var cnt=G.inv[n]||0;
        if(cnt>0){
          delete G.inv[n];delete G.invI[n];delete G.invT[n];
          addLog('🗑️ 丢弃了 '+n+' ×'+cnt+'（全部）。','event');
        }
      }
      upd();save();
    }
  });
}
function showConfirm(title,desc,callback){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmDesc').textContent=desc;
  var actions=document.getElementById('confirmActions');
  actions.innerHTML='<button class="mc" id="confirmYes">确认</button><button class="mx" id="confirmNo">取消</button>';
  document.getElementById('confirmModal').classList.remove('hidden');
  document.getElementById('confirmYes').addEventListener('click',function(){
    document.getElementById('confirmModal').classList.add('hidden');
    callback(true);
  });
  document.getElementById('confirmNo').addEventListener('click',function(){
    document.getElementById('confirmModal').classList.add('hidden');
    callback(false);
  });
  document.getElementById('confirmBg').addEventListener('click',function(){
    document.getElementById('confirmModal').classList.add('hidden');
    callback(false);
  });
}

function closeModal(){
  document.getElementById('itemModal').classList.add('hidden');

}

function build(id){
  var b=BLDS.find(function(x){return x.id===id;});
  if(!b){return;}
  var lv=G.bld[id]||0;
  if(lv>=4){return;}
  var nx=b.lvs[lv];
  if(!nx||nx.bp){return;}
  if(!hasC(G,nx.c)){return;}
  useC(G,nx.c);
  G.bld[id]=lv+1;
  if(id==='storage'){G.bagMax=BAG_LV[lv+1]||G.bagMax;}
  if(id==='shelter'){
    var durBonus=[0,15,15,20,20][lv+1]||0;
    G.maxDur+=durBonus;
    G.durability=Math.min(G.maxDur,G.durability+durBonus);
    addLog('🛶 船耐久上限+'+durBonus+'！','reward');
  }
  var stCost=10+lv*5;
  G.stamina=Math.max(0,G.stamina-stCost);
  addLog('🔨 '+(lv?'升级':'建造')+b.n+'到Lv.'+(lv+1)+'！'+nx.d,'reward');
  adv(Math.ceil(3+lv*1.5));
}

function upRod(){
  var nr=RODS.find(function(r){return r.lv===G.rod+1;});
  if(!nr||!hasC(G,nr.cost)){return;}
  useC(G,nr.cost);
  G.rod=nr.lv;
  G.stamina=Math.max(0,G.stamina-6);
  addLog('🎣 升级为Lv.'+nr.lv+' '+nr.n+'！','reward');
  adv(2);
}

function buy(id){
  var it=SHOP.find(function(x){return x.id===id;});
  if(!it){return;}
  var stk=G.shopStk[id]!==undefined?G.shopStk[id]:it.stk;
  if(stk<=0){return;}
  var pk=Object.keys(it.p)[0];
  var pv=it.p[pk];
  if(pk==='shell'){if(G.shells<pv){return;}G.shells-=pv;}
  else{if(G.pearls<pv){return;}G.pearls-=pv;}
  G.shopStk[id]=stk-1;
  if(id==='bait'){G.bait+=3;addLog('🪱 鱼饵+3次品质加成！','reward');}
  else if(id==='repair'){G.hp=Math.min(G.maxHp,G.hp+20);addLog('🔧 生命+20！','reward');}
  else if(id==='map'){
    var nx=null;
    for(var i=0;i<ISLANDS.length;i++){
      if(!G.vis.includes(ISLANDS[i].n) && G.dist>=ISLANDS[i].minD && G.dist<=ISLANDS[i].maxD){
        nx=ISLANDS[i];break;
      }
    }
    addLog(nx?'🗺️ 下个岛屿：'+nx.i+nx.n+'（约'+Math.ceil(nx.hr/24)+'天后）':'🗺️ 没有更多岛屿了。','reward');
  }else if(id==='revive'){G.revive=true;addLog('💊 死亡自动复活一次！','reward');}
  else if(id==='radio'){
    addI(G,'旧收音机','📻','cur',null,1);
    addLog('📻 获得旧收音机！','reward');
  }
  save();upd();
}

/* ========== TRADE ========== */
function refreshTrades(){
  var p=TRADE_T.slice();
  for(var i=p.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=p[i];p[i]=p[j];p[j]=tmp;}
  G.trades=p.slice(0,3);
  G.tLeft=2;
}
function renderTrade(){
  document.getElementById('tLeft').textContent=G.tLeft;
  var l=document.getElementById('tradeList');
  l.innerHTML='';
  for(var i=0;i<(G.trades||[]).length;i++){
    var t=G.trades[i];
    var can=G.tLeft>0&&hasTradeItem(G,t.g.m,t.gn);
    var d=document.createElement('div');
    d.className='ti';
    d.innerHTML='<span class="ti-icon">'+t.g.i+'→'+t.r.i+'</span><div class="ti-info"><div class="ti-name">'+t.g.n+'×'+t.gn+' → '+t.r.n+'×'+t.rn+'</div></div><button class="td" '+(can?'':'disabled')+' data-trade="'+i+'">换</button>';
    l.appendChild(d);
  }
  var tradeBtns=l.querySelectorAll('[data-trade]');
  for(var tb=0;tb<tradeBtns.length;tb++){
    (function(btn){
      btn.addEventListener('click',function(){
        trade(parseInt(btn.getAttribute('data-trade')));
      });
    })(tradeBtns[tb]);
  }
}
function hasTradeItem(g,m,c){
  if(m[0]==='_'){return cntSub(g,m.slice(1))>=c;}
  return(g.inv[m]||0)>=c;
}
function useTradeItem(g,m,c){
  if(m[0]==='_'){
    var s=m.slice(1);
    var r=c;
    for(var k in g.inv){
      var i=g.invT[k];
      if(i&&i.s===s){
        var t=Math.min(g.inv[k],r);
        g.inv[k]-=t;
        r-=t;
        if(g.inv[k]<=0){delete g.inv[k];delete g.invI[k];delete g.invT[k];}
        if(r<=0){break;}
      }
    }
    return;
  }
  remI(g,m,c);
}
function trade(i){
  if(G.tLeft<=0){return;}
  var t=G.trades[i];
  if(!hasTradeItem(G,t.g.m,t.gn)){return;}
  useTradeItem(G,t.g.m,t.gn);
  if(t.r.t==='cur'){
    if(t.r.s==='shell'){G.shells+=t.rn;}else{G.pearls+=t.rn;}
  }else{addI(G,t.r.n,t.r.i,t.r.t,t.r.s,t.rn);}
  G.tLeft--;
  addLog('🤝 '+t.g.n+'×'+t.gn+' → '+t.r.n+'×'+t.rn,'reward');
  save();upd();
}

function exploreIsland(){
  var isl=G.curIsl;
  if(!isl){return;}
  G.vis.push(isl.n);
  G._lastIslandDay=G.day; // 记录登岛日
  var loot=[];
  for(var idx=0;idx<isl.loot.length;idx++){
    var l=isl.loot[idx];
    if(l.t==='cur'){
      if(l.s==='shell'){G.shells+=l.c;loot.push('🐚×'+l.c);}
      else{G.pearls+=l.c;loot.push('💎×'+l.c);}
    }else{addI(G,l.n,l.i,l.t,l.s||null,l.c);loot.push(l.i+l.n+'×'+l.c);}
  }
  G.stamina=Math.max(0,G.stamina-12);
  addLog(isl.i+' 探索'+isl.n+'！'+loot.join('、'),'reward');
  // 触发岛屿事件
  if(Math.random()<0.5||G._firstEv){
    G._firstEv=false;
    document.getElementById('islandOv').classList.add('hidden');
    G.curIsl=null;
    var ev=ISL_EV[Math.floor(Math.random()*ISL_EV.length)];
    showEvChoice(ev.i+' '+ev.n,ev.desc,ev.opts);
    return;
  }
  document.getElementById('islandOv').classList.add('hidden');
  G.curIsl=null;
  adv(3);
}

  if(G._crew){bb.innerHTML+='<span class="buff-tag">👥船员×'+G._crew+'</span>';}
  if(G._siren){bb.innerHTML+='<span class="buff-tag">🧜海妖祝福</span>';}
  if(G._stormComing){bb.innerHTML+='<span class="buff-tag debuff">⛈️风暴将至</span>';}
  if(G.bait>0){bb.innerHTML+='<span class="buff-tag">🪱鱼饵×'+G.bait+'</span>';}
  if(G._glowB>0){bb.innerHTML+='<span class="buff-tag">✨夜光饵×'+G._glowB+'</span>';}
  if(G.meditateCooldown>0){bb.innerHTML+='<span class="buff-tag">⏳冥想冷却</span>';}

  var ri=RODS.find(function(r){return r.lv===G.rod;});
  document.getElementById('rodLv').textContent='Lv.'+G.rod+' '+(ri?ri.n:'');
  document.getElementById('baitInfo').textContent=G.bait>0?'(鱼饵×'+G.bait+')':'';

  renderInv();
  renderCraft();
  renderShop();
  renderTrade();
  renderCrew();
}

function stab(n,btn){
  var allBtns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<allBtns.length;i++){allBtns[i].classList.remove('active');}
  btn.classList.add('active');
  var panels=document.querySelectorAll('.panel');
  for(var i=0;i<panels.length;i++){panels[i].classList.remove('active');}
  document.getElementById('p'+n).classList.add('active');
}

/* ========== INIT ========== */
function init(){
  // Tab buttons
  var tabBtns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<tabBtns.length;i++){
    (function(btn){
      btn.addEventListener('click',function(){
        var tab=btn.getAttribute('data-tab');
        stab(tab,btn);
      });
    })(tabBtns[i]);
  }

  // Action buttons
  document.getElementById('fishBtn').addEventListener('click',doFish);
  document.getElementById('restBtn').addEventListener('click',doRest);
  document.getElementById('sleepBtn').addEventListener('click',doSleep);
  document.getElementById('meditateBtn').addEventListener('click',doMeditate);

  // Island buttons
  document.getElementById('exploreBtn').addEventListener('click',exploreIsland);
  document.getElementById('skipBtn').addEventListener('click',skipIsland);

  // Brief button
  document.getElementById('briefBtn').addEventListener('click',closeBrief);

  // Restart
  document.getElementById('restartBtn').addEventListener('click',restart);

  // Try load or show traits
  if(load()&&G&&!G.over){
    addLog('（存档已加载）');
    upd();
  }else{
    showTraits({pearls:0,pts:0});
  }
}

// Start after DOM ready
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}

})();
</script>
</body>
</html>
